# Continuous integration. This is the only workflow: Vercel is the canonical
# deploy target (it builds from the repository on push and deploys `api/`
# alongside the static client), so nothing here deploys anything. The former
# GitHub Pages workflow published a static site on which `api/` could not run
# — a client whose provider boundary 404s — and was retired for that reason.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, every run. The in-memory store cannot prove that the
    # spend cap holds under concurrency — single-threaded JavaScript is atomic
    # for free — so the suites that prove it run here against the engine that
    # deploys, and fail rather than skip when no database is configured.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportly
          POSTGRES_PASSWORD: sportly
          POSTGRES_DB: sportly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportly -d sportly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPORTLY_TEST_DATABASE_URL: postgres://sportly:sportly@localhost:5432/sportly_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            echo "== $f"
            psql "$SPORTLY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      # The Ciqual snapshot under data/ciqual is committed, so this needs no
      # network: the same bytes every run, the same bytes production loads.
      - name: Load the Ciqual snapshot and report the row count
        run: node scripts/ingest-ciqual.mjs apply --in data/ciqual

      # The synonym seed points at Ciqual rows, so it goes in after them. The
      # matching suite also loads the same file itself; this step proves the
      # script that production runs applies it.
      - name: Load the food synonym seed
        run: node scripts/seed-food-synonyms.mjs apply --in data/food-matching/synonyms.fr.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Vercel compiles api/ and server/ file by file and runs them under
      # Node's ESM loader, which rejects an extensionless relative import.
      # Nothing else here loads the handlers that way — vitest resolves what
      # Node would not, and a typecheck is not a load — so emit and import
      # every api/ entrypoint with plain node, exactly as the runtime will.
      - name: Load api/ entrypoints with plain node ESM
        run: pnpm check:esm-load

      - name: Unit tests (in-memory and Postgres, nothing skipped)
        run: pnpm test:unit

      # The coach suites run on an injected clock (src/coach/__tests__/clock.ts).
      # One green day proves nothing about the next: the journeys speak in
      # relative dates and the demo seed places sessions by weekday, so the
      # same family is run once per weekday of a full week.
      - name: Coach suites on every weekday of a week
        run: |
          for d in 14 15 16 17 18 19 20; do
            echo "== SPORTLY_TEST_NOW=2026-09-$d"
            SPORTLY_TEST_NOW=2026-09-$d pnpm vitest run src/coach
          done

      - name: Build and scan the bundle for server configuration
        run: pnpm build
