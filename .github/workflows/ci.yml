# Continuous integration. This is the only workflow: Vercel is the canonical
# deploy target (it builds from the repository on push and deploys `api/`
# alongside the static client), so nothing here deploys anything. The former
# GitHub Pages workflow published a static site on which `api/` could not run
# — a client whose provider boundary 404s — and was retired for that reason.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, every run. The in-memory store cannot prove that the
    # spend cap holds under concurrency — single-threaded JavaScript is atomic
    # for free — so the suites that prove it run here against the engine that
    # deploys, and fail rather than skip when no database is configured.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportly
          POSTGRES_PASSWORD: sportly
          POSTGRES_DB: sportly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportly -d sportly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPORTLY_TEST_DATABASE_URL: postgres://sportly:sportly@localhost:5432/sportly_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            echo "== $f"
            psql "$SPORTLY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (in-memory and Postgres, nothing skipped)
        run: pnpm test:unit

      - name: Build and scan the bundle for server configuration
        run: pnpm build
